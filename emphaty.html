                    </div>

                        <div class="col-lg-12 col-md-9 d-flex justify-content-evenly">
                            <form class="form" enctype="multipart/form-data" data-aos="fade-up">
                                <label for="name" data-aos="fade-up">Nama</label><br>
                                <input type="text" id="name" name="nama" value="" required oninput="checkForm()"><br>
                                <label for="email" data-aos="fade-up">Email</label><br>
                                <input type="email" id="email" name="email" placeholder="lorem@mail.com" value="" required oninput="checkForm()"><br>
                                <label for="message" data-aos="fade-up">Pesan</label><br>
                                <textarea id="message" name="message" value="" required style="height: 300px" oninput="checkForm()"></textarea><br>
                                <button type="button" id="send" onclick="sendMail(event)" disabled data-aos="fade-up">Send</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
